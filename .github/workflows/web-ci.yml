# PR gate for the Spawnery web SPA (W1, sp-2ckv.6).
# Runs on every push / PR against master that touches web/ or Go web-related paths.
# Does NOT deploy — that's web-release.yml.
name: web-ci

on:
  push:
    branches: [master]
    paths:
      - "web/**"
      - "internal/cp/**"
      - "internal/weborigin/**"
      - "cmd/spawnery_cp/**"
      - "cmd/authsvc/**"
  pull_request:
    branches: [master]
    paths:
      - "web/**"
      - "internal/cp/**"
      - "internal/weborigin/**"
      - "cmd/spawnery_cp/**"
      - "cmd/authsvc/**"

jobs:
  web:
    name: Web — lint, type-check, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      # [WM20]: NEVER npm install — always npm ci from the committed lockfile.
      # npm workspaces (client-sdk epic): web depends on the @spawnery/client workspace
      # package, so `npm ci` MUST run from the repo root against the root lockfile — a
      # web/-local npm ci silently ignores workspace deps instead of erroring.
      - name: Install dependencies
        working-directory: .
        run: npm ci

      # client-sdk epic: web imports @spawnery/client, whose entry point (sdk/ts/src/index.ts)
      # imports its generated Connect/protobuf code (sdk/ts/src/gen/**). That dir is gitignored
      # (sdk/ts/.gitignore: src/gen/) and produced only by `buf generate` (sdk/ts/package.json's
      # `gen` script). Without this, tsc/build fail on a fresh checkout with
      # "Cannot find module './gen/...'".
      - name: Install buf (TS SDK codegen)
        run: |
          curl -sSL -o "$RUNNER_TEMP/buf" "https://github.com/bufbuild/buf/releases/download/v1.71.0/buf-$(uname -s)-$(uname -m)"
          chmod +x "$RUNNER_TEMP/buf"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Generate TS SDK codegen (sdk/ts/src/gen)
        working-directory: .
        run: npm --prefix sdk/ts run gen

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: ESLint
        run: npx eslint .

      - name: Vitest (hermetic unit tests)
        run: npm test

      # Build in development mode (no VITE_CP_ORIGIN set).
      # Must pass --mode development so Vite sets config.mode='development'; otherwise the
      # SRI plugin's production guard throws when VITE_CP_ORIGIN is absent. This still
      # validates the plugin logic and that all assets are coverable.
      - name: Build (dev-origin, SRI validation)
        run: npx vite build --mode development

  go-web:
    name: Go — ws origin + CORS hermetic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go test -race ./internal/cp/... ./internal/weborigin/... ./cmd/spawnery_cp/... ./internal/authsvc/... ./cmd/authsvc/...
        run: CGO_ENABLED=1 go test -race -count=1 ./internal/cp/... ./internal/weborigin/... ./cmd/spawnery_cp/... ./internal/authsvc/... ./cmd/authsvc/...
