# Control-plane production overrides — deep-merged on top of cp.yaml when SPAWNERY_ENV=prod.
# Thin by design: only the values that differ from the base. Secret values are ${sops:} references
# resolved from secrets.prod.sops.yaml at startup (age key via SOPS_AGE_KEY_FILE).

auth:
  mode: prod                   # dev tokens ignored; root artifact trust required

store:
  driver: postgres
  dsn: "${sops:store.dsn}"     # real DSN (with password) lives encrypted in secrets.prod.sops.yaml

internal:
  listen: "127.0.0.1:8081"
  trust_domain: "prod.spawnery.internal"
  root_ca: "/etc/spawnery/cp/root.pem"
  cert: "/etc/spawnery/cp/cp-service.pem"
  chain: "/etc/spawnery/cp/cp-service-chain.pem"
  key: "/etc/spawnery/cp/cp-service-key.pem"
  server_name: "authsvc.internal"
  revocation_state: "/var/lib/spawnery/cp-revocations/state.json"
  revocation_issuers:
    - "/etc/spawnery/cp/service-intermediate.pem"
    - "/etc/spawnery/cp/cloud-intermediate.pem"
    - "/etc/spawnery/cp/self-hosted-intermediate.pem"
  revocation_crls:
    - "/etc/spawnery/cp/service.crl.pem"
    - "/etc/spawnery/cp/cloud-node.crl.pem"
    - "/etc/spawnery/cp/self-hosted-node.crl.pem"
