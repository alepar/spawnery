# Control-plane production overrides — deep-merged on top of cp.yaml when SPAWNERY_ENV=prod.
# Thin by design: only the values that differ from the base. Secret values are ${sops:} references
# resolved from secrets.prod.sops.yaml at startup (age key via SOPS_AGE_KEY_FILE).

auth:
  mode: prod                   # dev tokens ignored; root artifact trust required

store:
  driver: postgres
  dsn: "${sops:store.dsn}"     # real DSN (with password) lives encrypted in secrets.prod.sops.yaml

internal:
  listen: "127.0.0.1:8081"
  trust_domain: "prod.spawnery.internal"
  root_ca: "/etc/spawnery/pki/root.pem"
  cert: "/etc/spawnery/pki/cp.pem"
  chain: "/etc/spawnery/pki/service-issuer.pem"
  key: "/etc/spawnery/pki/cp-key.pem"
  server_name: "authsvc.internal"
  revocation_state: "/var/lib/spawnery/cp/certificate-revocations.json"
  revocation_issuers:
    - "/etc/spawnery/pki/service-issuer.pem"
    - "/etc/spawnery/pki/cloud-node-issuer.pem"
    - "/etc/spawnery/pki/self-hosted-node-issuer.pem"
  revocation_crls:
    - "/etc/spawnery/pki/service.crl"
    - "/etc/spawnery/pki/cloud-node.crl"
    - "/etc/spawnery/pki/self-hosted-node.crl"
