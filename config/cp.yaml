# Control-plane base config (shared across all environments; dev-oriented defaults).
# Per-environment deltas live in cp.<env>.yaml and deep-merge on top. Every value here is
# overridable by env vars (the CP_*/NODE_*/EVALUATOR_* alias table) and CLI --set.

listen: "127.0.0.1:8080"
# Browser-origin allowlist for CORS + WS upgrade. Empty = dev (loopback + private-network only).
allowed_origins: ""

store:
  driver: sqlite               # sqlite | postgres
  dsn: "file:cp.db?_pragma=busy_timeout(5000)"

auth:
  mode: dev                    # dev | prod
  dev_tokens: "dev-token=dev"  # "name=token,..." — honored only in dev mode
  environment: ""              # root/signer environment name (required in prod)
  root_ca: ""                  # environment root certificate PEM (required in prod)
  signer_revocation_statement: "" # deployed offline statement (optional before generation one)
  signer_revocation_state: ""  # persisted monotonic state (required in prod)
  session_reauth_interval: 0s  # 0 disables periodic session re-auth
  as_url: ""                   # AS base URL; when set, wires the CP→AS GitHub link-preflight checker
  as_revocation_url: ""        # AS revocation feed URL (empty disables the poller)
  revocation_poll_interval: 30s

internal:
  insecure_dev_node_on_public: false # explicit loopback-only compatibility lane; never production
  listen: ""
  trust_domain: ""
  root_ca: ""
  cert: ""
  chain: ""
  key: ""
  server_name: ""
  revocation_state: ""
  revocation_issuers: []
  revocation_crls: []
  revocation_urls: []
  revocation_refresh_interval: 30s

telemetry: "telemetry/events.jsonl"   # JSONL sink path; empty disables

max_spawns_per_owner: 5
shutdown_grace: 30s            # graceful-shutdown drain timeout on SIGTERM/SIGINT

evaluator:                     # CP-side metric evaluators (disabled by default)
  quota_suspend_mb: 0          # >0 enables quota-based suspend
  idle_enabled: false          # enable idle-only evaluation
  idle_detached: 15m
  idle_attached: 60m

# Skills Garage store (sp-nrzf.3.14.4). Empty endpoint disables URL skill ingest (FailedPrecondition).
# The bucket must be pre-provisioned out-of-band — the CP's S3 key is Forbidden for MakeBucket.
# Set SKILLS_S3_ENDPOINT (or skills.endpoint) to enable; credentials via SKILLS_S3_ACCESS_KEY /
# SKILLS_S3_SECRET_KEY (or reuse JOURNAL_S3_* values for the dev setup).
skills:
  endpoint: ""           # S3 host:port for CP-internal access; empty = ingest disabled
  node_endpoint: ""      # S3 host:port for presigned URLs served to nodes; defaults to endpoint
  access_key_id: ""      # S3 access key
  secret_access_key: ""  # S3 secret key
  region: "garage"       # S3 region label (Garage default)
  disable_tls: false     # true = plain HTTP (dev Garage only)
  bucket: "spawnery-skills"  # pre-provisioned skills bucket name
  github_token: ""       # optional GitHub Bearer token (raises rate limit 60→5000/hr per IP)
  zstd_level: 3          # zstd compression level 1–19 (3 = fast, good ratio)
